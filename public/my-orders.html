<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Orders & Tracking | Sasta-mall</title><link rel="stylesheet" href="/css/style.css"><style>
*{box-sizing:border-box}.orders-page{max-width:1050px;margin:30px auto;padding:0 16px}.orders-page h1{margin-bottom:8px}.intro{color:#667085;line-height:1.6}.order-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 4px 16px rgba(20,35,60,.04)}.order-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #edf0f5;padding-bottom:14px;margin-bottom:14px}.status{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:30px;padding:6px 10px;font-size:12px;font-weight:bold}.items,.tracking{width:100%;border-collapse:collapse;margin:10px 0 18px}.items th,.items td,.tracking th,.tracking td{text-align:left;padding:10px;border-bottom:1px solid #edf0f5;font-size:13px;vertical-align:top}.tracking-box{border:1px solid #dbeafe;background:#f8fbff;border-radius:10px;padding:14px;margin:10px 0}.muted{color:#667085;font-size:13px}.track-link{display:inline-block;margin-top:8px;color:#1d4ed8;font-weight:bold}.empty{padding:24px;background:#fff;border-radius:12px}.header-actions a[href="/my-orders.html"]{font-weight:bold}@media(max-width:600px){.order-card{padding:14px}.items,.tracking{display:block;overflow:auto}}
</style></head><body>
<header class="site-header"><div class="logo">Sasta-mall</div><nav><a href="/">Home</a><a href="/products.html">Products</a><a href="/help.html">Help</a></nav><div class="header-actions"><a href="/login.html">Login</a><a href="/cart.html">🛒 Cart</a></div></header>
<main class="orders-page"><h1>My Orders & Tracking</h1><p class="intro">Yahan tumhare apne orders aur sirf woh tracking entries nazar aayengi jin mein courier company aur tracking ID save ki gayi ho.</p><div id="orders"><div class="empty">Orders load ho rahe hain…</div></div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'Rs. '+Number(v||0).toLocaleString('en-PK');
async function load(){const box=document.getElementById('orders');try{const r=await fetch('/api/orders/mine',{credentials:'same-origin'});const d=await r.json();if(r.status===401){box.innerHTML='<div class="empty">Please <a href="/login.html">login</a> to see your orders and tracking.</div>';return}if(!r.ok)throw Error(d.error||'Could not load orders');if(!d.orders?.length){box.innerHTML='<div class="empty">Abhi tumhare account mein koi order nahi hai.</div>';return}box.innerHTML=d.orders.map(o=>{const items=(o.items||[]).map(i=>`<tr><td>${esc(i.product_name)}</td><td>${Number(i.quantity)}</td><td>${money(i.price)}</td></tr>`).join('');const tracks=(o.tracking||[]).map(t=>`<div class="tracking-box"><strong>${esc(t.product_name)}</strong><br><span class="muted">Quantity covered: ${Number(t.quantity_covered||1)}</span><p><strong>Courier:</strong> ${esc(t.courier_name)}<br><strong>Tracking ID:</strong> ${esc(t.tracking_number)}</p>${t.tracking_url?`<a class="track-link" href="${esc(t.tracking_url)}" target="_blank" rel="noopener">Track parcel with courier ↗</a>`:''}</div>`).join('');return `<article class="order-card"><div class="order-top"><div><strong>Order #${Number(o.id)}</strong><br><span class="muted">${esc(o.created_at||'')}</span></div><div><span class="status">${esc(o.order_status||'pending')}</span><br><strong>${money(o.total)}</strong></div></div><h3>Products</h3><table class="items"><thead><tr><th>Product</th><th>Qty</th><th>Unit price</th></tr></thead><tbody>${items||'<tr><td colspan="3">No products</td></tr>'}</tbody></table><h3>Tracking</h3>${tracks||'<p class="muted">Abhi is order ki tracking details add nahi hui hain. Tracking save hote hi yahan nazar aa jayegi.</p>'}</article>`}).join('')}catch(e){box.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
load();
</script><script src="/js/auth-ui.js"></script></body></html>
