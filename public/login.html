<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sasta-mall</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="site-header">

    <div class="logo">Sasta-mall</div>

    <nav>
        <a href="/">Home</a>
        <a href="/products.html">Products</a><a href="/help.html">Help</a>
    </nav>

    <div class="header-actions">
        <a href="/login.html">Login</a>
        <a href="/signup.html">Create Account</a>
        <a href="/cart.html">🛒 Cart</a>
    </div>

</header>


<main>

    <section class="products-section">

        <div style="
            max-width:500px;
            margin:40px auto;
            background:white;
            padding:35px;
            border-radius:16px;
            border:1px solid #e5e7eb;
            box-shadow:0 8px 30px rgba(0,0,0,0.06);
        ">

            <h1 style="text-align:center; margin-top:0;">
                Login
            </h1>

            <p style="
                text-align:center;
                color:#6b7280;
                margin-bottom:30px;
            ">
                Login to your Sasta-mall account
            </p>

            <form id="loginForm">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    required
                    style="
                        width:100%;
                        padding:12px;
                        margin:8px 0 18px;
                        border:1px solid #d1d5db;
                        border-radius:8px;
                    "
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    required
                    style="
                        width:100%;
                        padding:12px;
                        margin:8px 0 25px;
                        border:1px solid #d1d5db;
                        border-radius:8px;
                    "
                >

                <button
                    type="submit"
                    class="button button-accent"
                    style="width:100%;"
                >
                    Login
                </button>

            </form>

            <div
                id="message"
                style="
                    margin-top:20px;
                    text-align:center;
                "
            ></div>

            <p style="
                text-align:center;
                margin-top:25px;
                color:#6b7280;
            ">
                Don't have an account?
                <a href="/signup.html">
                    Create Account
                </a>
            </p>

        </div>

    </section>

</main>


<footer>
    <p>© 2026 Sasta-mall</p>
</footer>


<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            message.textContent = "Logging in...";


            try {

                const response = await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "same-origin",

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


                const result = await response.json();


                if (!response.ok) {

                    message.style.color = "#dc2626";

                    message.textContent =
                        result.error || "Login failed.";

                    return;
                }


                message.style.color = "#16a34a";

                message.textContent =
                    "Login successful!";


                // Check where the user originally came from
                const params =
                    new URLSearchParams(window.location.search);

                const redirect =
                    params.get("redirect");


                setTimeout(() => {

                    if (
                        redirect &&
                        redirect.startsWith("/")
                    ) {

                        window.location.href = redirect;

                    } else {

                        window.location.href = "/";

                    }

                }, 800);


            } catch (error) {

                console.error(error);

                message.style.color = "#dc2626";

                message.textContent =
                    "Something went wrong. Please try again.";

            }

        });

</script>


<script src="/js/auth-ui.js"></script>

</body>
</html>
